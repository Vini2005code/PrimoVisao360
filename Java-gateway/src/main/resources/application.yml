spring:
  application:
    name: visao360-gateway
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mvp}
  jackson:
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  rls:
    enabled: false
  tenant:
    header-required: true
    local-clinic-id: ${LOCAL_CLINIC_ID:11111111-1111-4111-8111-111111111111}
  database:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    schema: ${DB_SCHEMA:public}
    require-safe-role: ${DATABASE_REQUIRE_SAFE_ROLE:true}
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    internal-api-key: ${INTERNAL_API_KEY:local-development-key-not-for-production}
    timeout: ${AI_SERVICE_TIMEOUT:30s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:visao360;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: Visao360LocalPool
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      continue-on-error: false
      encoding: UTF-8
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  rls:
    enabled: false
  tenant:
    header-required: false

---
spring:
  config:
    activate:
      on-profile: mvp
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
    show-sql: false

app:
  rls:
    enabled: false
  tenant:
    header-required: false

---
spring:
  config:
    activate:
      on-profile: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
    show-sql: false

app:
  rls:
    enabled: true
  tenant:
    header-required: true
