services:
  inteligencia-360:
    build:
      context: .
      dockerfile: Dockerfile
    image: primordial/inteligencia-360:local
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY deve ser definida}
      GROQ_MAX_COMPLETION_TOKENS: ${GROQ_MAX_COMPLETION_TOKENS:-1200}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-30}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY deve ser definida}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SCHEMA: ${DB_SCHEMA:-ehr_teste}
      DATABASE_MIN_POOL_SIZE: ${DATABASE_MIN_POOL_SIZE:-1}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-5}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-3000}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_STT_MODEL_PATH: ${VOICE_STT_MODEL_CONTAINER_PATH:-/models/faster-whisper-base}
      VOICE_STT_LANGUAGE: ${VOICE_STT_LANGUAGE:-pt}
      VOICE_STT_DEVICE: ${VOICE_STT_DEVICE:-cpu}
      VOICE_STT_COMPUTE_TYPE: ${VOICE_STT_COMPUTE_TYPE:-int8}
      VOICE_STT_CPU_THREADS: ${VOICE_STT_CPU_THREADS:-2}
      VOICE_STT_MAX_CONCURRENCY: ${VOICE_STT_MAX_CONCURRENCY:-1}
      VOICE_TTS_MODEL_PATH: ${VOICE_TTS_MODEL_CONTAINER_PATH:-/models/pt_BR-faber-medium.onnx}
      VOICE_TTS_CONFIG_PATH: ${VOICE_TTS_CONFIG_CONTAINER_PATH:-/models/pt_BR-faber-medium.onnx.json}
      VOICE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-10485760}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-60}
      VOICE_TTS_MAX_CHARACTERS: ${VOICE_TTS_MAX_CHARACTERS:-1500}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${VOICE_MODELS_HOST_PATH:-./models}
        target: /models
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s
    networks:
      - inteligencia
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  inteligencia:
    driver: bridge
